---
permalink: /hg3d/
redirect_from:
  - /hg3d
# external redirect handled in the body below (not via redirect_to) so the
# GoatCounter ping fires before navigating away
external_url: https://3dhumangan.github.io/
---

<!DOCTYPE html>
<html>
<head>
<link rel="canonical" href="{{ page.external_url }}"/>
<meta http-equiv="content-type" content="text/html; charset=utf-8" />
<meta http-equiv="refresh" content="2;url={{ page.external_url }}" />
</head>
<body>
    <h1>Redirecting...</h1>
      <a href="{{ page.external_url }}">Click here if you are not redirected.<a>
      <!-- MapMyVisitors analytics: an async tracker would be cancelled by the
           immediate navigation, so load map.js and redirect once it has loaded
           (giving its beacon a moment to fire), with a timeout fallback. The
           meta-refresh above is the last-resort fallback. -->
      <div style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true">
        <script>
          (function() {
            var done = false;
            function go() { if (!done) { done = true; location = '{{ page.external_url }}'; } }
            var s = document.createElement('script');
            s.type = 'text/javascript';
            s.id = 'mapmyvisitors';
            s.src = '//mapmyvisitors.com/map.js?d=OVas2h6GXLWYYpmkZv04q_lmp_6GJZ8tzpKkc6_qt88&cl=ffffff&w=a';
            s.onload = function() { setTimeout(go, 150); };
            s.onerror = go;
            (document.currentScript.parentNode || document.body).appendChild(s);
            setTimeout(go, 1200);
          })();
        </script>
      </div>
</body>
</html>
