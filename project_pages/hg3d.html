---
permalink: /hg3d/
redirect_from:
  - /hg3d
# external redirect handled in the body below (not via redirect_to) so the
# GoatCounter ping fires before navigating away
external_url: https://3dhumangan.github.io/
---

<!DOCTYPE html>
<html>
<head>
<link rel="canonical" href="{{ page.external_url }}"/>
<meta http-equiv="content-type" content="text/html; charset=utf-8" />
<meta http-equiv="refresh" content="1;url={{ page.external_url }}" />
</head>
<body>
    <h1>Redirecting...</h1>
      <a href="{{ page.external_url }}">Click here if you are not redirected.<a>
      <!-- GoatCounter analytics: ping before redirecting (async count.js would be
           cancelled by the immediate navigation), then redirect within 300ms -->
      <script>
        (function() {
          var done = false;
          function go() { if (!done) { done = true; location = '{{ page.external_url }}'; } }
          var img = new Image();
          img.onload = img.onerror = go;
          img.src = 'https://inrainbws.goatcounter.com/count?p=' +
                    encodeURIComponent(location.pathname) +
                    '&r=' + encodeURIComponent(document.referrer);
          setTimeout(go, 300);
        })();
      </script>
</body>
</html>
