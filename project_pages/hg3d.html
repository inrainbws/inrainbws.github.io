---
permalink: /hg3d/
redirect_from:
  - /hg3d
# external redirect handled in the body below (not via redirect_to) so the
# Umami pageview fires before navigating away
external_url: https://3dhumangan.github.io/
---

<!DOCTYPE html>
<html>
<head>
<link rel="canonical" href="{{ page.external_url }}"/>
<meta http-equiv="content-type" content="text/html; charset=utf-8" />
<meta http-equiv="refresh" content="2;url={{ page.external_url }}" />
</head>
<body>
    <h1>Redirecting...</h1>
      <a href="{{ page.external_url }}">Click here if you are not redirected.<a>
      <!-- Umami analytics: an auto-tracking script would be cancelled by the
           immediate navigation, so load it with auto-tracking off, send the
           pageview by hand, and redirect once it resolves, with a timeout
           fallback. The meta-refresh above is the last-resort fallback. -->
      <script>
        (function() {
          var done = false;
          function go() { if (!done) { done = true; location = '{{ page.external_url }}'; } }
          var s = document.createElement('script');
          s.src = 'https://cloud.umami.is/script.js';
          s.setAttribute('data-website-id', 'bc4564dd-cfab-41cd-a589-b17c8bb2c848');
          s.setAttribute('data-auto-track', 'false');
          s.onload = function() {
            try { Promise.resolve(window.umami.track()).then(go, go); } catch (e) { go(); }
          };
          s.onerror = go;
          document.body.appendChild(s);
          setTimeout(go, 1200);
        })();
      </script>
</body>
</html>
